# Alembic configuration for the LineSense backend.
#
# The database URL is NOT set here: migrations/env.py resolves it from
# `-x db_url=...` (used by tests) or from Settings.migration_database_url
# (LS_MIGRATION_DATABASE_URL), which uses the linesense_owner role.

[alembic]
script_location = migrations

# Make `app` importable from migrations/env.py when running `uv run alembic ...`
# from services/backend (this project is `[tool.uv] package = false`).
prepend_sys_path = .

path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
